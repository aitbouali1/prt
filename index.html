    <!-- Static form so Netlify can detect the contact form at build time.
         The React <Contact> form mirrors these field names and posts to "/". -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" />
      <input name="subject" />
      <textarea name="message"></textarea>
    </form>
